services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      DATABASE_URL: "host=db user=postgres password=postgres dbname=blog port=5432 sslmode=disable"
      REDIS_URL: "redis:6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy