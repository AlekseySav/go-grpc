syntax = "proto3";

package blog.v1;
option go_package = "blog/gen/blog";

import "protoc-gen-openapiv2/options/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: { title: "Blog API"; version: "v1"; }
  schemes: HTTP;
  consumes: "application/json";
  produces: "application/json";
};

service BlogService {
  rpc GetPosts(GetPostsRequest) returns (GetPostsResponse) {
    option (google.api.http) = { get: "/v1/posts" };
  }
  rpc CreatePost(CreatePostRequest) returns (Post) {
    option (google.api.http) = { post: "/v1/posts" body: "*" };
  }
  rpc UpdatePost(UpdatePostRequest) returns (Post) {
    option (google.api.http) = { put: "/v1/posts/{id}" body: "*" };
  }
  rpc DeletePost(DeletePostRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/posts/{id}" };
  }
  rpc ToggleLike(ToggleLikeRequest) returns (Post) {
    option (google.api.http) = { post: "/v1/posts/{id}/like" };
  }
}

message Author {
  string id = 1;
  string nickname = 2;
  string photo_url = 3;
}

message Post {
  string id = 1;
  Author author = 2;
  string body = 3;
  string created_at = 4;
  int32 likes_count = 5;
  bool is_liked_by_user = 6;
}

message GetPostsRequest  { int32 limit = 1; int32 offset = 2; }
message GetPostsResponse { repeated Post posts = 1; }
message CreatePostRequest { string body = 1; }
message UpdatePostRequest { string id = 1; string body = 2; }
message DeletePostRequest { string id = 1; }
message ToggleLikeRequest { string id = 1; }
